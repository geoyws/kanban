[package]
name = "kanban"
version = "0.3.0"
edition = "2024"
description = "Durable private work ledger for long-horizon agents"
license = "MIT"

[[bin]]
name = "kanban"
path = "rust/main.rs"

[dependencies]
anyhow = "1.0.104"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
