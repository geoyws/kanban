[package]
name = "kanban"
version = "0.3.0"
edition = "2024"
description = "Durable private work ledger for long-horizon agents"
license = "MIT"

[lib]
name = "kanban"
path = "rust/lib.rs"

[[bin]]
name = "kanban"
path = "rust/bin/kanban.rs"

# `kb` is the same program under a shorter name. Agents type this hundreds of
# times per session, and a shell alias would not reach the non-interactive
# cages that call it. Both binaries are shims over one library, so the crate is
# compiled once.
[[bin]]
name = "kb"
path = "rust/bin/kb.rs"

[[bin]]
name = "kanban-dispatcher"
path = "rust/bin/kanban-dispatcher.rs"

[[bin]]
name = "kanban-codex-queue-adapter"
path = "rust/bin/kanban-codex-queue-adapter.rs"

[[bin]]
name = "kanban-codex-app-server-adapter"
path = "rust/bin/kanban-codex-app-server-adapter.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
libc = "0.2.189"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
sha2 = "0.10.9"
tiny_http = { version = "0.12.0", default-features = false }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
headless_chrome = "1"

[profile.release]
lto = "thin"
strip = true
